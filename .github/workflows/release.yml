name: Release Builds

# A push to `dev` publishes a dev prerelease; pushing an exact vMAJOR.MINOR.PATCH
# tag publishes that version as a release. `rehearse_release` builds, packages
# and smoke-tests a release of the current commit without publishing anything,
# so the release path can be checked before a tag exists.
on:
  workflow_dispatch:
    inputs:
      rehearse_release:
        description: Build this commit as a release (nothing is published)
        type: boolean
        default: false
  push:
    branches:
      - dev
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  BASE_VERSION_FALLBACK: v0.0.1
  GOPROXY: https://goproxy.cn,direct

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}${{ matrix.libc == 'musl' && '-musl' || '' }}-${{ matrix.arch_label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    # What the artifacts were built as, so publishing does not derive it again.
    # Every matrix entry computes the same values from the same commit.
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch_label: amd64
            runner: ubuntu-latest
            cc: gcc
            cgo_cflags: ""
            cgo_ldflags: ""
          # musl builds run inside Alpine on a native runner. malgo needs cgo, and
          # a glibc binary cannot start on Alpine at all.
          - goos: linux
            goarch: amd64
            arch_label: amd64
            libc: musl
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            arch_label: arm64
            libc: musl
            runner: ubuntu-24.04-arm
          - goos: linux
            goarch: arm64
            arch_label: arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            cgo_cflags: ""
            cgo_ldflags: ""
          - goos: linux
            goarch: 386
            arch_label: i686
            runner: ubuntu-latest
            cc: gcc
            cgo_cflags: -m32
            cgo_ldflags: -m32
          - goos: darwin
            goarch: amd64
            arch_label: amd64
            runner: macos-15-intel
            cc: clang
            cgo_cflags: ""
            cgo_ldflags: ""
          - goos: darwin
            goarch: arm64
            arch_label: arm64
            runner: macos-latest
            cc: clang
            cgo_cflags: ""
            cgo_ldflags: ""
          - goos: windows
            goarch: amd64
            arch_label: amd64
            runner: windows-latest
            cc: gcc.exe
            cgo_cflags: ""
            cgo_ldflags: ""
            msystem: MINGW64
            msys_bin: mingw64
            msys_packages: mingw-w64-x86_64-gcc
          - goos: windows
            goarch: arm64
            arch_label: arm64
            runner: windows-11-arm
            cc: clang.exe
            cgo_cflags: -Wno-return-mismatch -Wno-dll-attribute-on-redeclaration
            cgo_ldflags: ""
            msystem: CLANGARM64
            msys_bin: clangarm64
            msys_packages: mingw-w64-clang-aarch64-clang
          - goos: windows
            goarch: 386
            arch_label: i686
            runner: windows-latest
            cc: gcc.exe
            cgo_cflags: ""
            cgo_ldflags: ""
            msystem: MINGW32
            msys_bin: mingw32
            msys_packages: mingw-w64-i686-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux i686 toolchain
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up MinGW-w64 for cgo
        id: msys2
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys_packages }}

      - name: Locate MinGW-w64 toolchain
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $toolBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.msys_bin }}\bin'
          $compiler = Join-Path $toolBin '${{ matrix.cc }}'
          if (-not (Test-Path -LiteralPath $compiler)) {
            Write-Host "MSYS2 location: ${{ steps.msys2.outputs.msys2-location }}"
            Write-Host "Expected toolchain bin: $toolBin"
            if (Test-Path -LiteralPath $toolBin) {
              Get-ChildItem -LiteralPath $toolBin | Select-Object -First 40 Name
            }
            throw "Compiler was not found: $compiler"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolBin
          "WINDOWS_CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - id: meta
        name: Compute build metadata
        shell: bash
        env:
          REHEARSE_RELEASE: ${{ inputs.rehearse_release || false }}
        run: |
          set -euo pipefail
          compute_base_version() {
            if [[ -n "${SAKI_BASE_VERSION:-}" ]]; then
              printf '%s\n' "${SAKI_BASE_VERSION}"
              return
            fi
            if [[ -n "${BASE_VERSION:-}" ]]; then
              printf '%s\n' "${BASE_VERSION}"
              return
            fi

            local fallback="${BASE_VERSION_FALLBACK:-v0.0.1}"
            local fallback_major=0 fallback_minor=0 fallback_patch=1
            if [[ "${fallback}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              fallback_major="${BASH_REMATCH[1]}"
              fallback_minor="${BASH_REMATCH[2]}"
              fallback_patch="${BASH_REMATCH[3]}"
            fi

            local best_tag="" best_count=""
            local tag count
            while IFS= read -r tag; do
              [[ "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
              count="$(git rev-list --count "${tag}..HEAD" 2>/dev/null || true)"
              [[ "${count}" =~ ^[0-9]+$ ]] || continue
              if [[ -z "${best_count}" || "${count}" -lt "${best_count}" ]]; then
                best_tag="${tag}"
                best_count="${count}"
              fi
            done < <(git tag --merged HEAD --list 'v*' 2>/dev/null || true)

            if [[ -n "${best_tag}" && "${best_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              printf 'v%s.%s.%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$((BASH_REMATCH[3] + best_count))"
              return
            fi

            count="$(git rev-list --count HEAD 2>/dev/null || echo 0)"
            [[ "${count}" =~ ^[0-9]+$ ]] || count=0
            printf 'v%s.%s.%s\n' "${fallback_major}" "${fallback_minor}" "$((fallback_patch + count))"
          }

          base_version="$(compute_base_version)"
          short_sha="${GITHUB_SHA::12}"
          branch="$(printf '%s' "${GITHUB_REF_NAME:-unknown}" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g')"
          if [[ -z "$branch" ]]; then
            branch="unknown"
          fi
          dirty="false"
          if [[ -n "$(git status --porcelain)" ]]; then
            dirty="true"
          fi
          version="${base_version}-${branch}-${short_sha}"
          if [[ "$dirty" == "true" ]]; then
            version="${version}-dirty"
          fi
          # A tag build is the release, and renders bare -- but only if the tag is
          # the version this commit computes anyway. Otherwise one build would
          # carry two versions, the tag's and the one in the binary.
          release=false
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${base_version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} is not the version this commit computes, ${base_version}" >&2
              exit 1
            fi
            release=true
          elif [[ "${REHEARSE_RELEASE}" == "true" ]]; then
            release=true
          fi
          if [[ "$release" == "true" ]]; then
            if [[ "$dirty" == "true" ]]; then
              echo "a release must be built from a clean tree" >&2
              exit 1
            fi
            version="${base_version}"
          fi
          ldflags="-s -w -X github.com/xiongnemo/saki/internal/version.BaseVersion=${base_version} -X github.com/xiongnemo/saki/internal/version.BranchName=${branch} -X github.com/xiongnemo/saki/internal/version.CommitHash=${short_sha} -X github.com/xiongnemo/saki/internal/version.Dirty=${dirty} -X github.com/xiongnemo/saki/internal/version.Release=${release}"
          artifact_name="saki-${version}-${{ matrix.goos }}${{ matrix.libc == 'musl' && '-musl' || '' }}-${{ matrix.arch_label }}"
          {
            echo "BRANCH_NAME=${branch}"
            echo "SHORT_SHA=${short_sha}"
            echo "DIRTY=${dirty}"
            echo "SAKI_BASE_VERSION=${base_version}"
            echo "SAKI_VERSION_BRANCH=${branch}"
            echo "SAKI_VERSION_COMMIT=${short_sha}"
            echo "SAKI_VERSION_DIRTY=${dirty}"
            echo "SAKI_VERSION=${version}"
            echo "SAKI_RELEASE=${release}"
            echo "VERSION_LDFLAGS=${ldflags}"
            echo "ARTIFACT_NAME=${artifact_name}"
          } >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Build Unix artifact
        if: matrix.goos != 'windows' && matrix.libc != 'musl'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cgo_cflags }}
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        run: |
          set -euo pipefail
          mkdir -p "dist/${ARTIFACT_NAME}"
          go build -trimpath -ldflags "${VERSION_LDFLAGS}" -o "dist/${ARTIFACT_NAME}/saki" ./cmd/saki
          actual_version="$("dist/${ARTIFACT_NAME}/saki" --version)"
          echo "Built version: ${actual_version}"
          [ "$actual_version" = "$SAKI_VERSION" ]
          tar -C dist -czf "dist/${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
          echo "ARCHIVE_PATH=dist/${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_ENV"

      # The oldest supported Alpine is the build root, so the binary only asks for
      # musl symbols every newer release still has. The Go toolchain setup-go
      # installed is statically linked, so the exact version go.mod names runs
      # unchanged inside the container. The suite runs here too: this is the only
      # place the cgo audio path is exercised against musl.
      - name: Build musl artifact
        if: matrix.libc == 'musl'
        shell: bash
        env:
          ALPINE_BUILD_IMAGE: alpine:3.21
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(go env GOROOT):/usr/local/go:ro" \
            -v "$PWD:/src" -w /src \
            -e GOPROXY -e VERSION_LDFLAGS -e ARTIFACT_NAME -e SAKI_VERSION \
            -e HOST_IDS="$(id -u):$(id -g)" \
            "$ALPINE_BUILD_IMAGE" sh -euc '
              apk add --no-cache gcc musl-dev alsa-lib >/dev/null
              export PATH=/usr/local/go/bin:$PATH CGO_ENABLED=1 GOFLAGS=-buildvcs=false
              go version
              go test ./...
              mkdir -p "dist/${ARTIFACT_NAME}"
              go build -trimpath -ldflags "${VERSION_LDFLAGS}" -o "dist/${ARTIFACT_NAME}/saki" ./cmd/saki
              actual_version="$("dist/${ARTIFACT_NAME}/saki" --version)"
              echo "Built version: ${actual_version}"
              [ "$actual_version" = "$SAKI_VERSION" ]
              chown -R "$HOST_IDS" dist
            '
          file "dist/${ARTIFACT_NAME}/saki"
          readelf -d "dist/${ARTIFACT_NAME}/saki" | grep NEEDED
          tar -C dist -czf "dist/${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}"
          echo "ARCHIVE_PATH=dist/${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_ENV"

      # A release is packaged as its version, 0.1.42-1. A dev build is a
      # prerelease of its base, and each format needs that said its own way.
      # nFPM turns the semver prerelease into deb and rpm's `~` (0.1.42~pre-1
      # sorts before 0.1.42-1), but for apk it only prepends an underscore, and
      # apk accepts nothing after one except _alpha, _beta, _pre and _rc:
      # v0.1.42-dev-<commit> would become 0.1.42_dev-<commit>-r1, which apk-tools
      # calls invalid. So the prerelease is always `pre` -- 0.1.42_pre-r1 for apk,
      # below a later v0.1.42 tag and above v0.1.41 -- and the full version,
      # commit included, goes into the description.
      - name: Package
        if: matrix.goos == 'linux'
        shell: bash
        env:
          NFPM_ARCH: ${{ matrix.goarch }}
          NFPM_RELEASE: v2.48.0
          PACKAGERS: ${{ matrix.libc == 'musl' && 'apk' || 'deb rpm' }}
        run: |
          set -euo pipefail
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_RELEASE}"
          sed -e "s|@NFPM_ARCH@|${NFPM_ARCH}|g" \
              -e "s|@NFPM_VERSION@|${SAKI_BASE_VERSION#v}$([ "$SAKI_RELEASE" = true ] || echo -pre)|g" \
              -e "s|@NFPM_BINARY@|${PWD}/dist/${ARTIFACT_NAME}/saki|g" \
              -e "s|@SAKI_VERSION@|${SAKI_VERSION}|g" \
              packaging/nfpm.yaml > dist/nfpm.yaml
          for packager in $PACKAGERS; do
            nfpm package --config dist/nfpm.yaml --packager "$packager" --target "dist/${ARTIFACT_NAME}.${packager}"
          done
          case "$PACKAGERS" in
            apk) tar -xzOf "dist/${ARTIFACT_NAME}.apk" --ignore-zeros .PKGINFO ;;
            *) dpkg-deb -f "dist/${ARTIFACT_NAME}.deb" Package Version Architecture Depends ;;
          esac

      - name: Build Windows artifact
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '${{ matrix.goarch }}'
          $env:CGO_ENABLED = '1'
          $env:CC = $env:WINDOWS_CC
          $env:CGO_CFLAGS = '${{ matrix.cgo_cflags }}'
          $env:CGO_LDFLAGS = '${{ matrix.cgo_ldflags }}'
          .\scripts\build-windows.ps1 -OutputDir "dist\$env:ARTIFACT_NAME" -SkipTests
          $builtVersion = (& "dist\$env:ARTIFACT_NAME\saki.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $builtVersion -cne $env:SAKI_VERSION) {
            throw "Built version '$builtVersion' does not match '$env:SAKI_VERSION'."
          }
          Write-Host "Built version: $builtVersion"
          Compress-Archive -Path "dist\$env:ARTIFACT_NAME\*" -DestinationPath "dist\$env:ARTIFACT_NAME.zip" -Force
          "ARCHIVE_PATH=dist\$env:ARTIFACT_NAME.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error

      - name: Upload packages
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-packages
          path: |
            dist/*.apk
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Installs each package the way a user would, and checks that the audio
  # library arrives as a dependency rather than being present already: miniaudio
  # needs ALSA at runtime and finds no backend without it. Alpine 3.21 and 3.24
  # are apk-tools 2 and 3; Ubuntu 24.04 renamed libasound2 to libasound2t64.
  package-smoke:
    name: Smoke ${{ matrix.format }} on ${{ matrix.image }} (${{ matrix.arch_label }})
    needs: build
    runs-on: ${{ matrix.arch_label == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: apk, image: "alpine:3.21", arch_label: amd64, libc: musl }
          - { format: apk, image: "alpine:3.21", arch_label: arm64, libc: musl }
          - { format: apk, image: "alpine:3.24", arch_label: amd64, libc: musl }
          - { format: apk, image: "alpine:3.24", arch_label: arm64, libc: musl }
          - { format: deb, image: "debian:stable", arch_label: amd64 }
          - { format: deb, image: "debian:stable", arch_label: arm64 }
          - { format: deb, image: "ubuntu:22.04", arch_label: amd64 }
          - { format: deb, image: "ubuntu:24.04", arch_label: amd64 }
          - { format: deb, image: "ubuntu:24.04", arch_label: arm64 }
          - { format: rpm, image: "fedora:latest", arch_label: amd64 }
          - { format: rpm, image: "fedora:latest", arch_label: arm64 }
          - { format: rpm, image: "rockylinux:9", arch_label: amd64 }

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: saki-*-linux-${{ matrix.libc == 'musl' && 'musl-' || '' }}${{ matrix.arch_label }}-packages
          path: pkg
          merge-multiple: true

      - name: Install and run
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -l pkg
          docker run --rm -e FORMAT -e EXPECTED_VERSION -v "$PWD/pkg:/pkg:ro" "${{ matrix.image }}" sh -euc '
            case "$FORMAT" in
              apk)
                apk --version
                apk add --no-cache --allow-untrusted /pkg/*.apk
                apk info -e alsa-lib
                version=$(awk "/^P:saki\$/ { found = 1 } found && /^V:/ { print substr(\$0, 3); exit }" /lib/apk/db/installed)
                invalid=$(apk version -c "$version")
                [ -z "$invalid" ] || { echo "apk calls $version invalid"; exit 1; }
                [ "$(apk version -t 0.0.1-r1 "$version")" = "<" ]
                ;;
              deb)
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq /pkg/*.deb
                dpkg -l "libasound2*" | grep "^ii"
                version=$(dpkg-query -W -f "\${Version}" saki)
                dpkg --compare-versions 0.0.1-1 lt "$version"
                ;;
              rpm)
                dnf install -y -q /pkg/*.rpm
                rpm -q alsa-lib
                version=$(rpm -q --qf "%{VERSION}-%{RELEASE}" saki)
                ;;
            esac
            echo "installed saki $version"
            actual_version="$(saki --version)"
            echo "Installed version: $actual_version"
            [ "$actual_version" = "$EXPECTED_VERSION" ]
          '

  publish:
    name: Publish ${{ needs.build.outputs.release == 'true' && 'Release' || 'Dev Prerelease' }}
    needs: [build, package-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # From the build job, never derived a second time: a release's tag, its
      # artifacts and the version in its binary have to be one string.
      - id: meta
        name: Compute release metadata
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || { echo "the build reported no version" >&2; exit 1; }
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = true ]; then
            echo "name=Saki ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "headline=Release ${VERSION}." >> "$GITHUB_OUTPUT"
          else
            echo "name=Dev prerelease ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            echo "headline=Automated prerelease build from \`dev\`." >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.deb
            dist/*.rpm
          body: |
            ${{ steps.meta.outputs.headline }}

            Commit: `${{ github.sha }}`

      # The package repository fetches this release by tag and hashes the assets
      # itself, so all this sends is which release to look at. Without the token
      # the release still ships and the repository's own sweep picks it up later.
      - name: Tell the package repository
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          PACKAGES_REPO: ${{ vars.PACKAGES_REPO || 'xiongnemo/packages' }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PACKAGES_DISPATCH_TOKEN is not set; ${PACKAGES_REPO} will pick this up on its own schedule."
            exit 0
          fi
          gh api "repos/${PACKAGES_REPO}/dispatches" \
            -f event_type=release-published \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[channel]=${{ steps.meta.outputs.channel }}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            || echo "::warning title=Package repository not notified::dispatch to ${PACKAGES_REPO} failed; its scheduled sweep is the backstop."
